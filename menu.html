<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House - Menu</title>
    <script>
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a href="index.html" class="logo">
          <img src="assets/img/logo.svg" alt="Coffee House Logo" />
        </a>
        <nav class="nav">
          <ul class="nav__list">
            <li>
              <a href="index.html#favorite-coffee" class="nav__link"
                >Favorite coffee</a
              >
            </li>
            <li><a href="index.html#about" class="nav__link">About</a></li>
            <li>
              <a href="index.html#mobile-app" class="nav__link">Mobile app</a>
            </li>
            <li><a href="#contacts" class="nav__link">Contact us</a></li>
          </ul>
        </nav>
        <div class="header__spacer"></div>
        <div class="header__controls">
          <button class="theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon">
              <img
                src="assets/img/sun.svg"
                alt=""
                class="theme-img theme-img--sun"
              />
            </span>
            <span class="theme-icon">
              <img
                src="assets/img/moon.svg"
                alt=""
                class="theme-img theme-img--moon"
              />
            </span>
          </button>

          <a href="menu.html" class="menu-button">
            <span class="menu-text">Menu</span>
            <img src="assets/img/coffee-cup.svg" alt="" class="menu-icon-img" />
            <img src="assets/img/burger.svg" alt="" class="burger-icon" />
          </a>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="menu-page">
        <div class="container">
          <h1 class="menu-page__title">
            Behind each of our cups hides an
            <span class="menu-page__title-accent">amazing surprise</span>
          </h1>

          <div class="menu-tabs">
            <button class="menu-tab active" data-tab="coffee">
              <span>☕</span> Coffee
            </button>
            <button class="menu-tab" data-tab="tea"><span>🫖</span> Tea</button>
            <button class="menu-tab" data-tab="dessert">
              <span>🍰</span> Dessert
            </button>
          </div>

          <div class="menu-section active" id="coffee">
            <div class="menu-grid"></div>
          </div>

          <div class="menu-section" id="tea">
            <div class="menu-grid"></div>
          </div>

          <div class="menu-section" id="dessert">
            <div class="menu-grid"></div>
          </div>
        </div>
      </section>
      <button class="refresh-btn" type="button" aria-label="Refresh">
        <img
          src="assets/img/refresh.svg"
          alt="Refresh icon"
          class="refresh-icon"
        />
      </button>
    </main>

    <footer class="footer" id="contacts">
      <div class="container footer__container">
        <div class="footer__col footer__col--info">
          <h2 class="footer__title">
            Sip, Savor, Smile.<br />
            <span class="footer__title-accent">It’s coffee time!</span>
          </h2>

          <div class="socials">
            <a
              href="https://twitter.com"
              target="_blank"
              rel="noopener noreferrer"
              class="socials__link"
              aria-label="Twitter"
            >
              <img
                src="assets/img/twitter.svg"
                alt="Twitter"
                class="socials__icon"
              />
            </a>

            <a
              href="https://instagram.com"
              target="_blank"
              rel="noopener noreferrer"
              class="socials__link"
              aria-label="Instagram"
            >
              <img
                src="assets/img/instagram.svg"
                alt="Instagram"
                class="socials__icon"
              />
            </a>

            <a
              href="https://facebook.com"
              target="_blank"
              rel="noopener noreferrer"
              class="socials__link"
              aria-label="Facebook"
            >
              <img
                src="assets/img/facebook.svg"
                alt="Facebook"
                class="socials__icon"
              />
            </a>
          </div>
        </div>

        <div class="footer__col footer__col--contacts">
          <h2 class="footer__subtitle">Contact us</h2>

          <ul class="contacts-list">
            <li class="contacts-list__item">
              <img
                src="assets/img/pin-alt.svg"
                alt=""
                class="contacts-list__icon"
              />
              <a
                href="https://maps.google.com/?q=8558+Green+Rd,+LA"
                target="_blank"
                rel="noopener noreferrer"
              >
                8558 Green Rd., LA
              </a>
            </li>

            <li class="contacts-list__item">
              <img
                src="assets/img/phone.svg"
                alt=""
                class="contacts-list__icon"
              />
              <a href="tel:+16035550123">+1 (603) 555-0123</a>
            </li>

            <li class="contacts-list__item">
              <img
                src="assets/img/clock.svg"
                alt=""
                class="contacts-list__icon"
              />
              <a
                href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Coffee+House+Visit&details=Working+hours:+Mon–Sat:+9:00–23:00"
                target="_blank"
                rel="noopener noreferrer"
              >
                Mon–Sat: 9:00–23:00
              </a>
            </li>
          </ul>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
